[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-commit"
version = "0.1.0"
description = "A commit-msg hook that judges whether the commit message matches the staged diff"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Valentyn Kit" }]
dependencies = []

[project.scripts]
jev-commit = "jev_commit.cli:main"

[tool.setuptools]
packages = ["jev_commit"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools"]
